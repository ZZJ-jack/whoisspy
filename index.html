<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>谁是卧底 - 出题工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            padding: 30px 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #2d3748;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .header .sub {
            color: #718096;
            font-size: 13px;
        }
        /* 分区标题 */
        .part-title {
            font-size: 15px;
            font-weight: 600;
            color: #2d3748;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .part-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: #667eea;
            border-radius: 2px;
        }
        /* 房主区 & 玩家区 样式 */
        .oper-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .input-item {
            flex: 1;
            min-width: 180px;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .input-item:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            color: #fff;
        }
        .owner-btn {
            background: #38b2ac;
        }
        .owner-btn:hover {
            background: #319795;
        }
        .player-btn {
            background: #667eea;
        }
        .player-btn:hover {
            background: #5a6edb;
        }
        .reset-btn {
            background: #ed8936;
            width: 100%;
            margin-top: 10px;
        }
        .reset-btn:hover {
            background: #dd7b2f;
        }
        /* 出题操作区 */
        .game-oper {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        #numInput {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            color: #2d3748;
            outline: none;
        }
        #numInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .game-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            color: #fff;
        }
        .random-btn {
            background: #38b2ac;
        }
        .query-btn {
            background: #667eea;
        }
        .btn-disabled {
            background: #bcc2e2 !important;
            cursor: not-allowed !important;
        }
        /* 结果区 */
        .result-box {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px 15px;
            background: #f7fafc;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            white-space: pre-wrap;
        }
        .result-box .error {
            color: #e53e3e;
            font-size: 15px;
        }
        .result-box .success {
            color: #38b2ac;
            font-size: 15px;
            font-weight: 500;
        }
        .result-box .pwd-text {
            color: #e53e3e;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 5px 0;
        }
        .result-box .num-text {
            color: #38b2ac;
            font-size: 18px;
            font-weight: 600;
        }
        .result-box .word-text {
            color: #667eea;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-top: 5px;
        }
        /* 提示区 */
        .tip-box {
            background: #edf2f7;
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 12px;
            color: #718096;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>谁是卧底 出题工具</h1>
            <div class="sub">服务器版 | 加密密码 | 双入口分离 <span id="bankCount"></span></div>
        </div>

        <!-- 房主独立操作区 -->
        <div class="part-title">🏠 房主入口</div>
        <div class="oper-group">
            <input type="number" class="input-item" id="ownerCount" placeholder="输入总玩家数（≥2）" min="2">
            <button class="btn owner-btn" id="genPwdBtn">生成加密初始密码</button>
        </div>
        <div style="font-size:12px;color:#718096;">提示：生成后请验证密码并出题</div>

        <!-- 玩家独立操作区 -->
        <div class="part-title">🎮 玩家入口</div>
        <div class="oper-group">
            <input type="text" class="input-item" id="playerPwd" placeholder="输入房主提供的加密密码">
            <button class="btn player-btn" id="verifyPwdBtn">验证密码进入游戏</button>
        </div>
        <div style="font-size:12px;color:#718096;">提示：密码由房主生成，无需修改</div>

        <!-- 全局重置按钮 -->
        <button class="btn reset-btn" id="resetBtn">重置所有配置（新游戏）</button>

        <!-- 出题操作区（验证后启用） -->
        <div class="part-title">🎲 出题区</div>
        <div class="game-oper">
            <input type="number" id="numInput" placeholder="输入题目编号" disabled>
            <button class="game-btn random-btn btn-disabled" id="randomBtn">随机出题</button>
            <button class="game-btn query-btn btn-disabled" id="queryBtn">查询题目</button>
        </div>

        <!-- 结果展示区 -->
        <div class="result-box" id="resultBox">
            <div style="color:#718096;">✅ 等待加载题库...</div>
        </div>

        <!-- 部署提示 -->
        <div class="tip-box">
            <p>📌 部署：HTML与title.txt同目录，txt一行一组「卧底词/平民词」</p>
            <p>🔒 密码规则：加密后无法肉眼识别身份，系统自动解析，强制1卧底</p>
            <p>🎮 流程：房主生成密码→玩家输密码→逐人出题获取专属词语</p>
        </div>
    </div>

    <script>
        // 全局配置
        let gameConfig = {
            isInited: false, // 是否已验证密码
            total: 0, spy: 1, civil: 0, // 人数配置
            currPwd: '', assigned: 0, lastRole: '', currNum: 0 // 密码/分配状态
        };
        let wordBank = {}; // 题库
        let validNums = []; // 有效题目编号

        // DOM元素
        const dom = {
            // 房主区
            ownerCount: document.getElementById('ownerCount'),
            genPwdBtn: document.getElementById('genPwdBtn'),
            // 玩家区
            playerPwd: document.getElementById('playerPwd'),
            verifyPwdBtn: document.getElementById('verifyPwdBtn'),
            // 全局
            resetBtn: document.getElementById('resetBtn'),
            numInput: document.getElementById('numInput'),
            randomBtn: document.getElementById('randomBtn'),
            queryBtn: document.getElementById('queryBtn'),
            resultBox: document.getElementById('resultBox'),
            bankCount: document.getElementById('bankCount')
        };

        // 页面加载初始化
        window.onload = function() {
            readTxtFromServer();
            bindAllEvents();
        };

        // 1. 绑定所有事件
        function bindAllEvents() {
            // 房主生成加密密码
            dom.genPwdBtn.addEventListener('click', generateEncryptPwd);
            // 玩家验证加密密码
            dom.verifyPwdBtn.addEventListener('click', verifyEncryptPwd);
            // 重置配置
            dom.resetBtn.addEventListener('click', resetAll);
            // 出题相关
            dom.randomBtn.addEventListener('click', randomGetWord);
            dom.queryBtn.addEventListener('click', getWordByNum);
            // 回车查询
            dom.numInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !dom.queryBtn.classList.contains('btn-disabled')) {
                    getWordByNum();
                }
            });
        }

        // 2. 加密函数：将配置转为Base64（混淆敏感信息）
        function encryptConfig(total, spy, civil, role = 'INIT') {
            const configStr = `${total},${spy},${civil},${role}`;
            return btoa(encodeURIComponent(configStr)); // Base64编码
        }

        // 3. 解密函数：Base64转配置（失败则密码无效）
        function decryptConfig(encryptPwd) {
            try {
                const configStr = decodeURIComponent(atob(encryptPwd));
                const [total, spy, civil, role] = configStr.split(',');
                return {
                    total: parseInt(total),
                    spy: parseInt(spy),
                    civil: parseInt(civil),
                    role: role
                };
            } catch (e) {
                return null; // 解密失败=密码无效
            }
        }

        // 4. 房主生成加密初始密码
        function generateEncryptPwd() {
            const total = parseInt(dom.ownerCount.value.trim());
            if (isNaN(total) || total < 2) {
                renderResult('error', '❌ 总玩家数必须≥2，请重新输入');
                dom.ownerCount.focus();
                return;
            }
            const civil = total - gameConfig.spy;
            // 生成加密初始密码
            const encryptPwd = encryptConfig(total, gameConfig.spy, civil);
            // 更新配置
            gameConfig = {
                isInited: false, total, spy: gameConfig.spy, civil,
                currPwd: encryptPwd, assigned: 0, lastRole: '', currNum: 0
            };
            // 提示房主
            renderResult('success', 
                `✅ 初始加密密码生成成功！\n配置：${total}人（卧底1人/平民${civil}人）\n请复制下方密码验证并告知玩家：\n<span class="pwd-text">${encryptPwd}</span>`
            );
            // 自动填入玩家密码框，方便房主验证
            dom.playerPwd.value = encryptPwd;
        }

        // 5. 验证加密密码（房主/玩家通用）
        function verifyEncryptPwd() {
            const inputPwd = dom.playerPwd.value.trim();
            if (!inputPwd) {
                renderResult('error', '❌ 请输入加密密码');
                dom.playerPwd.focus();
                return;
            }
            // 解密密码
            const config = decryptConfig(inputPwd);
            if (!config) {
                renderResult('error', '❌ 密码无效！请确认密码是否正确');
                dom.playerPwd.value = '';
                dom.playerPwd.focus();
                return;
            }
            // 更新配置
            gameConfig.isInited = true;
            gameConfig.total = config.total;
            gameConfig.spy = config.spy;
            gameConfig.civil = config.civil;
            gameConfig.lastRole = config.role;
            gameConfig.currPwd = inputPwd;
            // 启用出题区
            enableGameOper(true);
            // 提示
            renderResult('success', 
                `✅ 密码验证成功！\n当前配置：${config.total}人（卧底${config.spy}人/平民${config.civil}人）\n你是第${gameConfig.assigned + 1}位玩家，请点击出题`
            );
        }

        // 6. 读取题库
        function readTxtFromServer() {
            fetch('title.txt', {
                method: 'GET', headers: { 'Content-Type': 'text/plain; charset=utf-8' }
            })
            .then(res => res.ok ? res.text() : Promise.reject('文件异常'))
            .then(text => {
                const lines = text.split(/\r?\n/).filter(line => line.trim().replace(/\s+/g, '') !== '');
                if (lines.length === 0) return renderResult('error', '❌ 题库为空，请检查title.txt');
                lines.forEach((line, idx) => {
                    const [spyWord, civilWord] = line.trim().replace(/\s*\/\s*/, '/').split('/');
                    if (spyWord && civilWord) wordBank[idx + 1] = [spyWord.trim(), civilWord.trim()];
                });
                validNums = Object.keys(wordBank).map(Number).sort((a, b) => a - b);
                dom.bankCount.innerText = `(${validNums.length}题)`;
                renderResult('success', `✅ 题库加载完成，共${validNums.length}道有效题目`);
            })
            .catch(err => {
                renderResult('error', '❌ 题库读取失败！请检查文件是否同目录');
                console.log(err);
            });
        }

        // 7. 随机出题
        function randomGetWord() {
            if (!gameConfig.isInited) return renderResult('error', '❌ 请先验证密码');
            if (validNums.length === 0) return renderResult('error', '❌ 题库无有效题目');
            const randomNum = validNums[Math.floor(Math.random() * validNums.length)];
            gameConfig.currNum = randomNum;
            dom.numInput.value = randomNum;
            assignRoleAndShowWord(randomNum);
        }

        // 8. 编号查询
        function getWordByNum() {
            if (!gameConfig.isInited) return renderResult('error', '❌ 请先验证密码');
            const num = parseInt(dom.numInput.value.trim());
            if (!num || !validNums.includes(num)) {
                renderResult('error', `❌ 请输入1-${validNums.length}的有效编号`);
                dom.numInput.focus();
                return;
            }
            gameConfig.currNum = num;
            assignRoleAndShowWord(num);
        }

        // 9. 身份分配+生成新加密密码
        function assignRoleAndShowWord(num) {
            // 计算已分配卧底/平民数
            const assignedSpy = gameConfig.assigned - gameConfig.civil + (gameConfig.lastRole === 'civil' ? 1 : 0);
            // 分配规则：未分配过随机选，卧底未满选卧底，否则选平民
            let currRole = gameConfig.assigned === 0 
                ? (Math.random() > 0.5 ? 'spy' : 'civil') 
                : (assignedSpy < gameConfig.spy ? 'spy' : 'civil');
            
            const [spyWord, civilWord] = wordBank[num];
            const myWord = currRole === 'spy' ? spyWord : civilWord;
            // 生成新加密密码（含当前身份）
            const newEncryptPwd = encryptConfig(gameConfig.total, gameConfig.spy, gameConfig.civil, currRole);
            // 更新配置
            gameConfig.assigned += 1;
            gameConfig.currPwd = newEncryptPwd;
            gameConfig.lastRole = currRole;
            // 禁用出题按钮，一人一词
            enableGameOper(false);
            // 展示结果
            renderResult('game', num, myWord, newEncryptPwd);
        }

        // 10. 启用/禁用出题按钮
        function enableGameOper(isEnable) {
            dom.numInput.disabled = !isEnable;
            dom.randomBtn.classList.toggle('btn-disabled', !isEnable);
            dom.queryBtn.classList.toggle('btn-disabled', !isEnable);
            if (isEnable) dom.numInput.placeholder = `输入1-${validNums.length}的编号`;
        }

        // 11. 重置所有配置
        function resetAll() {
            gameConfig = { isInited: false, total: 0, spy: 1, civil: 0, currPwd: '', assigned: 0, lastRole: '', currNum: 0 };
            dom.ownerCount.value = '';
            dom.playerPwd.value = '';
            dom.numInput.value = '';
            enableGameOper(false);
            renderResult('success', '✅ 已重置所有配置，可开始新游戏');
        }

        // 12. 统一结果渲染
        function renderResult(type, ...args) {
            const box = dom.resultBox;
            switch (type) {
                case 'error':
                    box.innerHTML = `<div class="error">${args[0]}</div>`;
                    break;
                case 'success':
                    box.innerHTML = `<div class="success">${args[0]}</div>`;
                    break;
                case 'game':
                    const [num, word, pwd] = args;
                    box.innerHTML = `
                        <div class="num-text">题目编号：${num}</div>
                        <div class="word-text">${word}</div>
                        <div class="success">✅ 你已获取专属词语（仅自己可见）</div>
                        <div class="success">💡 下一位玩家密码：</div>
                        <div class="pwd-text">${pwd}</div>
                    `;
                    break;
            }
        }
    </script>
</body>
</html>
